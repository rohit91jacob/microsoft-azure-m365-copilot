name: refresh

# Scheduled data refresh: take today's snapshot of the Azure Retail Prices API, the Microsoft
# 365 roadmap feed and the GitHub repos, add any new Internet Archive captures, run
# silver -> DQ gate -> dbt build -> gold, and publish the results site to GitHub Pages.
# Every source is public and credential-free. The built-in GITHUB_TOKEN only raises the GitHub
# REST rate limit; an optional GH_API_TOKEN secret is used instead when it is set.
# This runs the pipeline on a GitHub runner with a local lake - not in Azure.

on:
  schedule:
    # Daily: Microsoft reprices meters and edits the roadmap continuously (the roadmap feed
    # changes most days), and live snapshots are one per UTC day.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rebuild silver from bronze"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  # A fixed path: the lake is cached between runs, so history accumulates day by day.
  AZM365_DATA_DIR: /home/runner/azm365-lake
  AZM365_LOG_FORMAT: json
  GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN || github.token }}

defaults:
  run:
    # bash -eo pipefail: a failing command piped into tee/tail must fail the step.
    shell: bash

jobs:
  build:
    name: refresh lake + build site
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Restore the lake from the previous run
        id: lake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AZM365_DATA_DIR }}
          key: azm365-lake-${{ github.run_id }}
          restore-keys: azm365-lake-
      - name: Report lake state
        run: |
          if [ -n "${{ steps.lake.outputs.cache-matched-key }}" ]; then
            echo "restored from: ${{ steps.lake.outputs.cache-matched-key }}"
            du -sh "$AZM365_DATA_DIR"
          else
            echo "restored from: nothing (fresh lake; history starts from the Internet Archive captures)"
          fi
      - run: uv sync --frozen
      - name: Extract today's live snapshots (idempotent per UTC day)
        run: uv run azm365 extract --source azure_prices --source m365_roadmap --source github
      - name: Extract new Internet Archive captures (best effort; the CDX API often answers 503)
        run: uv run azm365 extract --source wayback || echo "::warning::Wayback extract failed; history will catch up on the next run"
      - name: silver -> DQ gate -> dbt build -> gold (exit 3 = DQ failure, 4 = dbt failure)
        run: |
          if [ "${{ inputs.full_refresh }}" = "true" ]; then uv run azm365 silver --full-refresh; fi
          uv run azm365 run --skip-extract
      - name: Save the lake for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AZM365_DATA_DIR }}
          key: azm365-lake-${{ github.run_id }}
      - name: Build the results site
        run: |
          uv run azm365 report --out site
          echo "### Results site" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run azm365 status >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    name: open or update a failure issue
    needs: [build, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Scheduled refresh is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or comment on the tracking issue
        run: |
          body="The scheduled \`refresh\` run failed: $RUN_URL

          See docs/runbook.md#scheduled-refresh-failed. Close this issue once a run is green."
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
