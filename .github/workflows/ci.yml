name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if uv.lock is out of date instead of silently re-locking.
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"

defaults:
  run:
    # bash -eo pipefail: a failing command piped into tee/tail must fail the step.
    shell: bash

jobs:
  lint:
    name: lint, lockfile, fixtures, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: Simulated fixtures are up to date with config/sources.yml
        run: uv run --no-sync python scripts/make_fixtures.py --check
      - name: gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: pipeline on fixtures + dbt build + site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AZM365_DATA_DIR: /tmp/azm365-ci
      DBT_TARGET: ci
      AZM365_DUCKDB_PATH: /tmp/azm365-ci/warehouse/azm365.duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Day 1 (SIMULATED fixtures) - extract -> silver -> DQ -> dbt build -> gold
        run: uv run azm365 run --fixtures tests/fixtures/http --as-of 2026-01-05
      - name: Day 2 - incremental run (price changes, roadmap slippage)
        run: uv run azm365 run --fixtures tests/fixtures/http --as-of 2026-01-06
      - name: Rerun day 2 - must land nothing and rebuild nothing
        run: |
          out=$(uv run azm365 run --fixtures tests/fixtures/http --as-of 2026-01-06 | tail -n 1)
          echo "$out"
          echo "$out" | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['landed']==0 and s['silver']['built']==0, s"
      - name: dbt build (models + tests) on the same warehouse
        run: uv run azm365 dbt build
      - name: dbt docs
        run: uv run azm365 dbt docs generate
      - name: End-to-end and idempotency tests
        run: uv run pytest -m e2e tests/e2e -v
      - name: Results site (labelled SIMULATED)
        run: |
          uv run azm365 report --out site
          grep -q "SIMULATED DATA" site/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-site-and-dbt-docs
          path: |
            site
            /tmp/azm365-ci/dbt_target/index.html
            /tmp/azm365-ci/dbt_target/manifest.json
            /tmp/azm365-ci/dbt_target/catalog.json

  dbt-fabric:
    name: dbt compile for Fabric Warehouse (T-SQL, no connection)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Compile every model and test against the fabric target
        run: make dbt-fabric-compile
      - name: Compiled SQL is T-SQL (bracket-quoted relations, no DuckDB-only syntax)
        run: |
          f=data/dbt_fabric_target/compiled/azm365/models/marts/finops/mart_region_price_index.sql
          grep -q "\[intermediate\].\[int_price_latest\]" "$f"
          ! grep -rqE "GROUP BY ALL|QUALIFY|::" data/dbt_fabric_target/compiled/azm365/models

  azurite:
    name: Azurite (npm) integration - pipeline on the Blob emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: npm ci --no-fund --no-audit
      - run: uv sync --frozen
      - name: Start Azurite (Blob) in the background
        run: |
          mkdir -p .azurite
          nohup npm run azurite > azurite.log 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 10000 && exit 0; sleep 1; done
          cat azurite.log; exit 1
      - name: pytest -m azurite (must not skip)
        run: uv run pytest -m azurite tests/integration -v -rs | tee azurite-tests.txt; ! grep -q SKIPPED azurite-tests.txt
      - name: Azurite log
        if: failure()
        run: cat azurite.log

  terraform:
    name: terraform fmt / validate / tflint / checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive -diff
      - name: terraform init (no backend) + validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: checkov (every skip is justified inline)
        run: uvx --from "checkov==3.3.26" checkov -d infra --framework terraform --compact --quiet
