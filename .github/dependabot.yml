version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # dbt-core and its adapters move together; bump them deliberately.
    ignore:
      - dependency-name: dbt-core
        update-types: [version-update:semver-minor]
      - dependency-name: dbt-duckdb
        update-types: [version-update:semver-minor]
      - dependency-name: dbt-fabric
        update-types: [version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
